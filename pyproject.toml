[project]
name = "snippets-api"
version = "0.1.0"
description = "A system for exchanging snippets"
authors = [
    {name = "Nikita Bondarev",email = "nikitabondarevvitebsk@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "bcrypt[cryptography] (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "alembic (>=1.19.2,<2.0.0)"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C", "N", "UP", "B", "A", "SIM", "ARG", "PT"]
